name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # node runs the generated hierarchy loader under tests/ae_mock.js.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install test dependencies
        # Only pytest: the v3 hierarchy code is vendored (_rotobot_hierarchy/).
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - run: pytest -q tests
      - name: The vendored hierarchy code matches rotobot-nuke
        run: bash tools/check-vendored-hierarchy.sh
